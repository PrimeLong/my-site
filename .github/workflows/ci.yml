name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Браузерные smoke-тесты: меню, одиночная партия, газета, карта, обучение,
  # сетевая партия — на ширине компьютера и телефона, главные сценарии в Safari (WebKit),
  # визуальные эталоны десяти экранов (playwright.config.js, e2e/visual.e2e.js).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # desktop и phone — Chromium, webkit — iPhone 13 (главные сценарии); визуальные эталоны — phone
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
